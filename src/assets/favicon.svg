<!-- Autorobottech favicon (A + circuit node) -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78c8f9"/>
      <stop offset="1" stop-color="#0077cc"/>
    </linearGradient>

    <radialGradient id="shine" cx="0.25" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00102a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="44" y="44" width="424" height="424" rx="110" fill="url(#bg)"/>
  <rect x="44" y="44" width="424" height="424" rx="110" fill="url(#shine)"/>

  <!-- Main mark -->
  <g filter="url(#shadow)">
    <!-- Stylized "A" (triangle with cutout) -->
    <path fill="#ffffff" fill-rule="evenodd" d="
      M170 392 L256 140 L342 392 Z
      M256 218 L214 324 L298 324 Z
    "/>

    <!-- Circuit node + link -->
    <path d="M360 176 L310 236" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <circle cx="360" cy="176" r="18" fill="#ffffff"/>
    <circle cx="360" cy="176" r="10" fill="#0077cc" opacity="0.95"/>
  </g>
</svg>